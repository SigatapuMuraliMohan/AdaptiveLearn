version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: personalized_learning_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Murali@2005}
      MYSQL_DATABASE: learning_platform_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - ./database/seed/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql
    restart: unless-stopped

volumes:
  mysql_data:
